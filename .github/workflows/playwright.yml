
name: EnergIA QA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    name: Tests and Playwright
    runs-on: ubuntu-latest

    env:
      AUTH_EMAIL: qa-ci@energia.local
      AUTH_PASSWORD: CiOnly-Password-123!
      AUTH_NAME: QA CI
      JWT_SECRET: ci-only-secret-for-disposable-tests
      QA_EMAIL: qa-ci@energia.local
      QA_PASSWORD: CiOnly-Password-123!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/go.sum

      - name: Run backend unit tests
        working-directory: backend
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: frontend
        run: pnpm test

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Build and start EnergIA
        run: docker compose up --build -d

      - name: Wait for EnergIA
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/docs >/dev/null \
              && curl -fsS http://localhost:3000 >/dev/null; then
              echo "EnergIA is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose logs
          exit 1

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop EnergIA
        if: always()
        run: docker compose down
